[package]
name = "mcp3425"
version = "2.0.0"
authors = ["Danilo Bargen <mail@dbrgn.ch>"]
documentation = "https://docs.rs/mcp3425"
repository = "https://github.com/dbrgn/mcp3425-rs"
license = "MIT OR Apache-2.0"
description = "Platform agnostic Rust driver for the Microchip MCP3425/6/7/8 ADC."
readme = "README.md"
keywords = ["mcp3425", "microchip", "driver", "adc", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
edition = "2021"

[features]
default = ["blocking"]
blocking = ["dep:embedded-hal"]
async = ["dep:embedded-hal-async"]
# Support for MCP3426 and MCP3427
dual_channel = []
# Support for MCP3428
quad_channel = []

[dependencies]
byteorder = { version = "1.5", default-features = false }
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
bitflags = "2.9"
measurements = { version = "0.11", default-features = false }
defmt = { version = "1.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1"], default-features = false }
linux-embedded-hal = "0.4"
rstest = "0.25"

[profile.release]
lto = true
